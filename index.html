<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Visual Schema Parser</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load D3.js v7 for Force Engine and Convex Hulls -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>

    <div id="controls">
        <button id="listen-btn">Start Listening</button>
        <button id="add-demo-btn">+ Add Concept</button>
        <button id="export-btn">Export Schema (.json)</button>
        <span id="status">Status: Idle</span>
    </div>

    <div id="transcript-preview">Speech transcript stream will display here in real-time...</div>

    <svg id="canvas-container">
        <defs>
            <marker id="arrow" viewBox="0 -5 10 10" refX="90" refY="0" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0,-5L10,0L0,5" fill="#60a5fa"/>
            </marker>
        </defs>
        <g id="viewport">
            <g id="hulls-layer"></g>
            <g id="links-layer"></g>
            <g id="nodes-layer"></g>
        </g>
    </svg>

    <script src="app.js"></script>
</body>
</html>
