<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MindMapper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<details id="panel" open>
  <summary>MindMapper — input</summary>
  <div class="body">
    <input type="file" id="file" accept=".txt,.md,.pdf,.docx" multiple>
    <textarea id="text" placeholder="Paste or upload your text here…"></textarea>
    <input id="key" type="password" autocomplete="off" placeholder="Gemini API key (kept only in your browser)">
    <div class="row">
      <input id="model" list="models" value="gemini-3.8-flash" title="Gemini model name">
      <datalist id="models"></datalist>
      <button id="check" class="alt nowrap">Check models</button>
    </div>
    <div class="row">
      <button id="go">Generate</button>
      <button id="cancel" class="alt" disabled>Cancel</button>
      <button id="clear" class="alt">Clear</button>
    </div>
    <div class="row">
      <button id="fit" class="alt">Fit view</button>
      <button id="zout" class="alt">−</button>
      <button id="zin" class="alt">+</button>
      <button id="pdf">Download PDF</button>
    </div>
    <div id="status"></div>
    <div id="err" hidden>
      <b>Error report — copy this and send it to Claude</b>
      <textarea id="errtxt" readonly></textarea>
      <button id="copyerr">Copy error report</button>
    </div>
  </div>
</details>
<div id="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg"><g id="vp"></g></svg></div>
<div id="legend"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/svg2pdf.js/2.2.4/svg2pdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
