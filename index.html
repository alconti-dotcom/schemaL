<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Speech to Concept Graph</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- D3.js Library -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <!-- ES Module Import Map for official Google GenAI SDK -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
</head>
<body>
    <div id="controls">
        <button id="listen-btn">Start Listening</button>
        <button id="add-demo-btn">Add Manual Concept</button>
        <button id="export-btn">Export Schema</button>
        <span id="status">Status: Idle</span>
    </div>

    <div id="transcript-preview"></div>

    <svg id="canvas-container">
        <g id="viewport">
            <g id="hulls-layer"></g>
            <g id="links-layer"></g>
            <g id="nodes-layer"></g>
        </g>
    </svg>

    <!-- Loaded as module to enable SDK imports -->
    <script type="module" src="app.js"></script>
</body>
</html>
